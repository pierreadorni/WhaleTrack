[project]
authors = [{name = "Thomas Fillon", email = "thomas.fillon@univ-ubs.fr"}]
dependencies = ["ultralytics"]
name = "WhaleTrack"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
whaletrack = { path = ".", editable = true }

[tool.pixi.tasks]
get_dataset = "python get_dataset.py"

[tool.pixi.dependencies]
matplotlib = ">=3.11.0,<4"
pandas = ">=3.0.3,<4"
numpy = ">=2.5.1,<3"
scipy = ">=1.18.0,<2"
opencv = ">=5.0.0,<6"
marimo = ">=0.23.14,<0.24"
ruff = ">=0.15.20,<0.16"
geopy = ">=2.4.1,<3"
nbformat = ">=5.10.4,<6"
jupyter = ">=1.1.1,<2"
folium = ">=0.20.0,<0.21"
utm = ">=0.7.0,<0.8"
flask = ">=3.1.3,<4"
flask_cors = ">=4.0.0,<5"
ultralytics = ">=8.4.96,<9"
torchvision = ">=0.28.0,<0.29"
huggingface_hub = ">=1.31.0,<2"
typer = ">=0.27.2,<0.28"

